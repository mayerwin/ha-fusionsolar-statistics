name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach the card to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/fusionsolar-statistics-card.js
